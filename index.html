<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Hospital Appointment System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card" style="max-width:460px;">
      <a href="home.html" class="auth-brand" style="text-decoration:none;">
        <span class="icon-chip">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v5a5 5 0 0 0 10 0V3"/><path d="M2 3h3M13 3h3"/><path d="M9 13v2a5 5 0 0 0 10 0v-1"/><circle cx="19" cy="11" r="2.5"/></svg>
        </span>
        Hospital Appointment System
      </a>
      <h2 style="margin-top:0;">Sign in to your account</h2>

      <form id="loginForm">
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" id="email" required autocomplete="email">
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <input type="password" id="password" required autocomplete="current-password">
        </label>

        <div style="text-align:right; margin:-6px 0 12px;">
          <a href="pages/forgot-password.html" style="color:var(--primary-700); font-weight:600; font-size:12.5px; text-decoration:none;">Forgot password?</a>
        </div>

        <div class="error-text" id="errorMsg" style="display:none;"></div>
        <button type="submit" class="btn" style="width:100%; justify-content:center;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M3 12h12"/></svg>
          Sign in
        </button>
      </form>

      <div class="muted" style="text-align:center; margin-top:16px; font-size:13px;">
        Don't have an account? <a href="pages/register.html" style="color:var(--primary-700); font-weight:600;">Register here</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("errorMsg");
      errorBox.style.display = "none";
      try {
        const auth = await apiRequest("/auth/login", {
          method: "POST", auth: false,
          body: { email: document.getElementById("email").value.trim(), password: document.getElementById("password").value }
        });
        Session.save(auth);
        window.location.href = Session.dashboardUrlForRole(auth.role);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
