<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacist Dashboard — Hospital Appointment System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-brand">
      <span class="topbar-mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v5a5 5 0 0 0 10 0V3"/><path d="M2 3h3M13 3h3"/><path d="M9 13v2a5 5 0 0 0 10 0v-1"/><circle cx="19" cy="11" r="2.5"/></svg>
      </span>
      Hospital Appointment System
    </div>
    <div class="topbar-user">
      <span id="welcomeMsg"></span>
      <a href="#" onclick="logout()" class="topbar-signout">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        Sign out
      </a>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <a href="#" class="tab active" data-tab="pending"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Pending</a>
      <a href="#" class="tab" data-tab="dispensed"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Dispensed history</a>
      <a href="#" class="tab" data-tab="formulary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>Drug formulary</a>
    </div>

    <div class="tab-panel active" id="panel-pending">
      <div class="grid-cards" id="pendingList"><div class="card muted">Loading…</div></div>
    </div>
    <div class="tab-panel" id="panel-dispensed">
      <div class="grid-cards" id="dispensedList"><div class="card muted">Loading…</div></div>
    </div>
    <div class="tab-panel" id="panel-formulary">

      
      <div class="card" style="max-width:520px;margin-bottom:16px;">
        <div class="card-head"><span class="icon-chip">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
        </span><h2>Add a drug to the formulary</h2></div>
        <form id="drugForm">
          <label class="field"><span class="field-label">Drug name</span><input type="text" id="drugName" required placeholder="e.g. Paracetamol"></label>
          <div style="display:flex;gap:12px;">
            <label class="field" style="flex:1;"><span class="field-label">Form</span><input type="text" id="drugForm2" placeholder="tablet, syrup, injection…"></label>
            <label class="field" style="flex:1;"><span class="field-label">Strength</span><input type="text" id="drugStrength" placeholder="e.g. 500mg"></label>
          </div>
          <button class="btn" type="submit">Add drug</button>
        </form>
      </div>
      

      <div class="grid-cards" id="formularyList"><div class="card muted">Loading…</div></div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/pharmacist.js"></script>
</body>
</html>
