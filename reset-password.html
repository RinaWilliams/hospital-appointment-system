<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password — Hospital Appointment System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-shell"><div class="auth-card" style="max-width:460px;">
    <div class="auth-brand"><span class="icon-chip">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v5a5 5 0 0 0 10 0V3"/><path d="M2 3h3M13 3h3"/><path d="M9 13v2a5 5 0 0 0 10 0v-1"/><circle cx="19" cy="11" r="2.5"/></svg>
    </span> Hospital Appointment System</div>
    <h2 style="margin-top:0;">Choose a new password</h2>
    <form id="resetForm">
      <label class="field"><span class="field-label">New password</span><input type="password" id="pwd" required minlength="6"></label>
      <label class="field"><span class="field-label">Confirm new password</span><input type="password" id="pwd2" required minlength="6"></label>
      <div class="error-text" id="errorMsg" style="display:none;"></div>
      <div class="success-text" id="successMsg" style="display:none;"></div>
      <button class="btn" style="width:100%;justify-content:center;" id="btn" type="submit">Update password</button>
    </form>
  </div></div>
  <script src="../js/api.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('errorMsg');
      const ok = document.getElementById('successMsg');
      err.style.display='none'; ok.style.display='none';
      const token = new URLSearchParams(location.search).get('token');
      const p1 = document.getElementById('pwd').value;
      const p2 = document.getElementById('pwd2').value;
      if (!token) { err.textContent='Missing reset token from the email link.'; err.style.display='block'; return; }
      if (!p1) { err.textContent='Please choose a new password.'; err.style.display='block'; return; }
      if (p1.length < 6) { err.textContent='Password must be at least 6 characters.'; err.style.display='block'; return; }
      if (p1 !== p2) { err.textContent='The two passwords do not match.'; err.style.display='block'; return; }
      try {
        document.getElementById('btn').disabled = true;
        await apiRequest('/auth/reset-password', { method:'POST', auth:false, body:{ token, newPassword: p1 }});
        ok.textContent = 'Password updated. Redirecting to sign in…';
        ok.style.display='block';
        setTimeout(()=>location.href='../index.html', 1500);
      } catch(e2) {
        err.textContent = e2.message || 'Could not reset password.';
        err.style.display='block';
        document.getElementById('btn').disabled = false;
      }
    });
  </script>
</body>
</html>
