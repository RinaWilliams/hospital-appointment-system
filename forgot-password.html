<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Hospital Appointment System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card" style="max-width:460px;">
      <div class="auth-brand">
        <span class="icon-chip">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v5a5 5 0 0 0 10 0V3"/><path d="M2 3h3M13 3h3"/><path d="M9 13v2a5 5 0 0 0 10 0v-1"/><circle cx="19" cy="11" r="2.5"/></svg>
        </span>
        Hospital Appointment System
      </div>
      <h2 style="margin-top:0;">Reset your password</h2>
      <div class="page-note">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        Enter the email you registered with. We'll send you a link to reset your password.
      </div>

      <form id="forgotForm">
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" id="email" required autocomplete="email">
        </label>
        <div class="error-text" id="errorMsg" style="display:none;"></div>
        <div class="success-text" id="successMsg" style="display:none;"></div>
        <button type="submit" class="btn" style="width:100%; justify-content:center;" id="submitBtn">Send reset link</button>
      </form>

      <div class="muted" style="text-align:center; margin-top:16px; font-size:13px;">
        Remembered it? <a href="../index.html" style="color:var(--primary-700); font-weight:600;">Back to sign in</a>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('errorMsg');
      const successBox = document.getElementById('successMsg');
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
      const email = document.getElementById('email').value.trim();
      if (!email) {
        errorBox.textContent = 'Please enter your email address.';
        errorBox.style.display = 'block'; return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errorBox.textContent = 'That email address looks invalid.';
        errorBox.style.display = 'block'; return;
      }
      try {
        document.getElementById('submitBtn').disabled = true;
        await apiRequest('/auth/forgot-password', { method: 'POST', auth: false, body: { email } });
        successBox.innerHTML = `If an account exists for <b>${escapeHtml(email)}</b>, a reset link is on its way. Check your inbox and spam folder.`;
        successBox.style.display = 'block';
        document.getElementById('forgotForm').reset();
      } catch (err) {
        errorBox.textContent = err.message || 'Could not send reset link. Please try again.';
        errorBox.style.display = 'block';
      } finally {
        document.getElementById('submitBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
