<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Dashboard — Hospital Appointment System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-brand">
      <span class="topbar-mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v5a5 5 0 0 0 10 0V3"/><path d="M2 3h3M13 3h3"/><path d="M9 13v2a5 5 0 0 0 10 0v-1"/><circle cx="19" cy="11" r="2.5"/></svg>
      </span>
      Hospital Appointment System
    </div>
    <div class="topbar-user">
      <span id="welcomeMsg"></span>
      <a href="#" onclick="logout()" class="topbar-signout">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        Sign out
      </a>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <a href="#" class="tab active" data-tab="ordered"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6.5L4.5 17a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L15 8.5V2"/><path d="M9 2h6M7 15h10"/></svg>Ordered</a>
      <a href="#" class="tab" data-tab="completed"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Completed</a>
    </div>

    <div class="tab-panel active" id="panel-ordered">
      <div class="grid-cards" id="orderedList"><div class="card muted">Loading…</div></div>
    </div>
    <div class="tab-panel" id="panel-completed">
      <div class="grid-cards" id="completedList"><div class="card muted">Loading…</div></div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/lab.js"></script>
</body>
</html>
